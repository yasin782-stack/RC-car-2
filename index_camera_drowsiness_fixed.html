<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RC Car Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --card: #151920;
    --card-border: #232833;
    --accent: #3d8bfd;
    --accent-dim: #1e4a8c;
    --good: #34c471;
    --bad: #ef4444;
    --text: #eef1f5;
    --text-dim: #8b93a1;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; min-height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  #app {
    max-width: 480px; margin: 0 auto; padding: 0 12px 28px;
    display: flex; flex-direction: column; gap: 12px;
  }

  #appHeader {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 4px 6px;
  }
  #appHeader .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #1e4a8c);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; box-shadow: 0 3px 10px rgba(61,139,253,0.35);
  }
  #appHeader .titles h1 {
    margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.3px;
  }
  #appHeader .titles p {
    margin: 1px 0 0; font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px;
  }

  .panel {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    padding: 14px 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .panelTitle {
    font-size: 10.5px; font-weight: 700; color: var(--text-dim);
    letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px;
  }

  /* ---------- top status row ---------- */
  #statusRow { display: flex; justify-content: space-between; align-items: center; }
  #status { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  #connectBtn {
    padding: 10px 20px; font-size: 13px; font-weight: 700; border-radius: 10px;
    border: none; background: var(--accent); color: white;
    box-shadow: 0 3px 10px rgba(61,139,253,0.35);
    transition: transform 0.1s;
  }
  #connectBtn:active { transform: scale(0.96); }

  /* ---------- GPS/GSM/SMS row ---------- */
  #infoBar { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: var(--text); flex-wrap: wrap; font-weight: 600; }
  #infoBar .item { display: flex; align-items: center; gap: 6px; }
  #infoBar .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4150; }
  #infoBar .dot.ok { background: var(--good); box-shadow: 0 0 7px var(--good); }
  #infoBar .dot.bad { background: var(--bad); box-shadow: 0 0 7px var(--bad); }
  #gpsReqBtn { cursor: pointer; font-size: 15px; color: var(--accent); }
  #coords { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  #distRow { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  #distRow span { color: var(--text); font-weight: 700; }

  /* ---------- message panel ---------- */
  #msgPanel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #msgInput {
    flex: 1; min-width: 140px; font-size: 13px; background: #0f1216; color: var(--text);
    border: 1px solid var(--card-border); border-radius: 9px; padding: 10px 12px;
    font-family: inherit;
  }
  #msgSendBtn {
    font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 9px;
    border: none; background: var(--good); color: white;
  }
  #msgStatus { font-size: 10px; color: var(--text-dim); width: 100%; }

  /* ---------- mode toggle ---------- */
  #modeToggle { display: flex; gap: 8px; justify-content: center; }
  .modeBtn {
    flex: 1; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    padding: 11px; border-radius: 10px; border: 1px solid var(--card-border);
    background: #0f1216; color: var(--text-dim);
  }
  .modeBtn.active#ecoBtn { background: var(--good); color: #fff; border-color: var(--good); }
  .modeBtn.active#sportBtn { background: #f44336; color: #fff; }

  /* ---------- eye camera panel ---------- */
  #eyeCamVideo {
    width: 100%; border-radius: 10px; background: #000;
    transform: scaleX(-1); aspect-ratio: 4/3; object-fit: cover;
    border: 1px solid var(--card-border);
  }
  #eyeModelStatus { font-size: 11px; color: #ffa270; min-height: 15px; margin-top: 6px; text-align: center; font-weight: 600; }
  #eyeStatusRow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  #eyeStatusText { font-size: 15px; font-weight: 700; }
  #drowsyBadge {
    font-size: 11.5px; font-weight: 700; padding: 6px 13px; border-radius: 8px;
    background: #0f1216; color: var(--text-dim); border: 1px solid var(--card-border);
  }
  #drowsyBadge.warn { background: var(--bad); color: #fff; border-color: var(--bad); }
  #camBtnRow { display: flex; gap: 8px; margin-top: 10px; }
  #camStartStopBtn, #camSwitchBtn {
    flex: 1; font-size: 12px; font-weight: 700; padding: 11px; border-radius: 9px; border: none;
  }
  #camStartStopBtn { background: var(--accent); color: white; }
  #camSwitchBtn { background: #0f1216; color: var(--text-dim); border: 1px solid var(--card-border); }

  /* ---------- settings panel (adjustable timing) ---------- */
  .sliderRow { margin-bottom: 14px; }
  .sliderRow:last-child { margin-bottom: 0; }
  .sliderLabel {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 8px;
  }
  .sliderLabel .val { color: var(--accent); font-weight: 800; }
  input[type="range"] {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 3px; background: #262c37; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 2px 6px rgba(61,139,253,0.5);
    border: 3px solid #0b0d10;
  }
  #alertSlider::-webkit-slider-thumb { background: var(--bad); box-shadow: 0 2px 6px rgba(239,68,68,0.5); }

  /* ---------- sleepy driver popup ---------- */
  #sleepyPopup {
    display: none;
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 50; width: 86vw; max-width: 380px;
    background: #180a0a; border: 2px solid var(--bad); border-radius: 16px;
    padding: 24px 20px; text-align: center;
    box-shadow: 0 0 40px rgba(239,68,68,0.5);
  }
  #sleepyPopup.active { display: block; animation: sleepyPulse 1s ease-in-out infinite; }
  @keyframes sleepyPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 55px rgba(239,68,68,0.85); }
  }
  #sleepyPopup .icon { font-size: 36px; }
  #sleepyPopup .title {
    font-size: 27px; font-weight: 800; color: #ff6b5e; letter-spacing: 1px;
    margin: 8px 0 6px; font-family: 'Inter', sans-serif;
  }
  #sleepyPopup .subtitle { font-size: 13px; color: #ffb3ab; letter-spacing: 0.4px; font-weight: 600; }

  /* ---------- collision alert ---------- */
  #collisionOverlay { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; }
  #collisionOverlay.active { animation: collisionPulse 0.5s steps(1, end) infinite; }
  @keyframes collisionPulse {
    0%, 49%  { opacity: 1; box-shadow: inset 0 0 10vw 3vw rgba(239,68,68,0.5); }
    50%, 100% { opacity: 0; box-shadow: none; }
  }
  #collisionIcon {
    position: fixed; top: 4vh; left: 50%; transform: translateX(-50%);
    z-index: 41; font-size: 28px; display: none; pointer-events: none;
    color: #ff6b5e; text-shadow: 0 0 10px var(--bad);
  }
  #collisionIcon.active { display: block; animation: collisionPulse 0.5s steps(1, end) infinite; }

  /* ---------- drive controls ---------- */
  #controlsGrid { display: flex; gap: 10px; }
  .controlCol { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .colLabel { font-size: 10.5px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-align: center; text-transform: uppercase; }
  .btnRow { display: flex; gap: 8px; }
  .ctrlBtn {
    flex: 1; font-size: 15px; font-weight: 700; padding: 18px 0; border-radius: 11px;
    border: 1px solid var(--card-border); background: #0f1216; color: var(--text-dim);
    transition: transform 0.08s;
  }
  .ctrlBtn:active { transform: scale(0.96); }
  .ctrlBtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .gearBtn.active#revBtn { background: var(--bad); border-color: var(--bad); }
  #holdMoveBtn {
    width: 100%; font-size: 16px; font-weight: 800; padding: 26px 0; border-radius: 11px;
    border: 1px solid var(--card-border); background: #0f1216; color: var(--text-dim); letter-spacing: 1px;
    transition: transform 0.08s;
  }
  #holdMoveBtn:active { transform: scale(0.98); }
  #holdMoveBtn.active { background: var(--good); color: #fff; border-color: var(--good); }
  #stopBtn {
    width: 100%; font-size: 16px; font-weight: 800; padding: 18px 0; border-radius: 11px;
    border: none; background: var(--bad); color: #fff; letter-spacing: 1px;
    box-shadow: 0 3px 12px rgba(239,68,68,0.35);
  }
</style>
</head>
<body>

<div id="app">

  <div id="appHeader">
    <div class="logo">&#128663;</div>
    <div class="titles">
      <h1>RC Car Control</h1>
      <p>DRIVER SAFETY SYSTEM</p>
    </div>
  </div>

  <div class="panel" id="statusRow">
    <div id="status">Not connected</div>
    <button id="connectBtn">Connect to Car</button>
  </div>

  <div class="panel" id="panelInfo">
    <div id="infoBar">
      <div class="item"><span class="dot" id="gpsDot"></span>GPS</div>
      <div class="item" id="gpsReqBtn">&#8635;</div>
      <div class="item"><span class="dot" id="gsmDot"></span>GSM</div>
      <div class="item"><span class="dot" id="smsDot"></span>SMS</div>
    </div>
    <div id="coords">-- , --</div>
    <div id="distRow">FRONT: <span id="distFront">--</span> cm &nbsp; REAR: <span id="distRear">--</span> cm</div>
  </div>

  <div class="panel" id="panelTiming">
    <div class="panelTitle">Drowsiness Timing</div>
    <div class="sliderRow">
      <div class="sliderLabel"><span>Stop car after eyes closed</span><span class="val" id="warnVal">2s</span></div>
      <input type="range" id="warnSlider" min="1" max="10" step="1" value="2">
    </div>
    <div class="sliderRow">
      <div class="sliderLabel"><span>Send SMS alert after</span><span class="val" id="alertVal">10s</span></div>
      <input type="range" id="alertSlider" min="1" max="10" step="1" value="10">
    </div>
  </div>

  <div class="panel" id="panelMsg">
    <div id="msgPanel">
      <input id="msgInput" type="text" maxlength="120" placeholder="SMS message">
      <button id="msgSendBtn">SEND SMS</button>
      <span id="msgStatus"></span>
    </div>
  </div>

  <div class="panel" id="panelMode">
    <div id="modeToggle">
      <button class="modeBtn active" id="ecoBtn">ECO</button>
      <button class="modeBtn" id="sportBtn">SPORT</button>
    </div>
  </div>

  <div class="panel">
    <video id="eyeCamVideo" autoplay playsinline muted></video>
    <div id="eyeModelStatus"></div>
    <div id="eyeStatusRow">
      <div id="eyeStatusText">EYES: --</div>
      <div id="drowsyBadge">NORMAL</div>
    </div>
    <div id="camBtnRow">
      <button id="camStartStopBtn">START CAMERA</button>
      <button id="camSwitchBtn">SWITCH CAMERA</button>
    </div>
  </div>

  <div class="panel">
    <div id="controlsGrid">
      <div class="controlCol">
        <div class="colLabel">STEER</div>
        <div class="btnRow">
          <button class="ctrlBtn" id="leftBtn">&#9664;<br>LEFT</button>
          <button class="ctrlBtn" id="rightBtn">&#9654;<br>RIGHT</button>
        </div>
      </div>
      <div class="controlCol">
        <div class="colLabel">GEAR</div>
        <div class="btnRow">
          <button class="ctrlBtn gearBtn active" id="fwdGearBtn">FWD</button>
          <button class="ctrlBtn gearBtn" id="revBtn">REV</button>
        </div>
      </div>
    </div>
    <div style="margin-top:8px;">
      <button id="holdMoveBtn">&#9650;<br>HOLD TO MOVE</button>
    </div>
    <div style="margin-top:8px;">
      <button id="stopBtn">&#9632; STOP</button>
    </div>
  </div>

</div>

<div id="sleepyPopup">
  <div class="icon">&#9888;</div>
  <div class="title">SLEEPY DRIVER</div>
  <div class="subtitle" id="sleepySubtitle">VEHICLE STOPPED &mdash; STAY ALERT</div>
</div>

<div id="collisionOverlay"></div>
<div id="collisionIcon">&#9888;</div>

<script>
const SERVICE_UUID   = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CMD_CHAR_UUID  = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const TELE_CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';

let bleDevice, bleServer, cmdChar, teleChar;
const statusEl = document.getElementById('status');

document.getElementById('connectBtn').addEventListener('click', () => {
  connectBLE(); // called synchronously and first - a direct response to
                // the tap, required for the Bluetooth permission prompt
});

async function connectBLE() {
  try {
    statusEl.textContent = 'Requesting device...';
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    statusEl.textContent = 'Connecting...';
    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(SERVICE_UUID);
    cmdChar = await service.getCharacteristic(CMD_CHAR_UUID);
    teleChar = await service.getCharacteristic(TELE_CHAR_UUID);

    await teleChar.startNotifications();
    teleChar.addEventListener('characteristicvaluechanged', onTelemetry);

    statusEl.textContent = 'Connected to ' + bleDevice.name;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err;
  }
}

function onDisconnected() {
  statusEl.textContent = 'Disconnected';
  sendCmd('S');
}

const collisionOverlay = document.getElementById('collisionOverlay');
const collisionIcon = document.getElementById('collisionIcon');

function onTelemetry(event) {
  const value = new TextDecoder().decode(event.target.value);

  const distMatch = value.match(/F:(-?\d+),R:(-?\d+)/);
  if (distMatch) {
    document.getElementById('distFront').textContent = distMatch[1];
    document.getElementById('distRear').textContent = distMatch[2];

    const front = parseInt(distMatch[1], 10);
    const rear = parseInt(distMatch[2], 10);
    const tooClose = (front > 0 && front < 20) || (rear > 0 && rear < 20);
    collisionOverlay.classList.toggle('active', tooClose);
    collisionIcon.classList.toggle('active', tooClose);
  }

  const gpsMatch = value.match(/GPS:(\d)/);
  const latMatch = value.match(/LAT:(-?\d+\.\d+)/);
  const lonMatch = value.match(/LON:(-?\d+\.\d+)/);
  const gsmMatch = value.match(/GSM:(\d)/);
  const smsMatch = value.match(/SMS:(\d)/);

  const gpsDot = document.getElementById('gpsDot');
  const gsmDot = document.getElementById('gsmDot');
  const smsDot = document.getElementById('smsDot');
  const coords = document.getElementById('coords');

  if (gpsMatch) {
    const hasFix = gpsMatch[1] === '1';
    gpsDot.className = 'dot ' + (hasFix ? 'ok' : 'bad');
    if (hasFix && latMatch && lonMatch) {
      coords.textContent = latMatch[1] + ', ' + lonMatch[1];
    } else {
      coords.textContent = 'no GPS fix';
    }
  }
  if (gsmMatch) gsmDot.className = 'dot ' + (gsmMatch[1] === '1' ? 'ok' : 'bad');
  if (smsMatch) {
    if (smsMatch[1] === '1') smsDot.className = 'dot ok';
    else if (smsMatch[1] === '2') smsDot.className = 'dot bad';
    else smsDot.className = 'dot';
  }
}

function sendCmd(cmd) {
  if (!cmdChar) return;
  const data = new TextEncoder().encode(cmd);
  cmdChar.writeValueWithoutResponse ? cmdChar.writeValueWithoutResponse(data) : cmdChar.writeValue(data);
}
window.sendCmd = sendCmd; // used by the eye-detection module below

// ---------------- SMS message panel ----------------
const msgStatusEl = document.getElementById('msgStatus');
document.getElementById('msgSendBtn').addEventListener('click', () => {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (!cmdChar) { msgStatusEl.textContent = 'not connected'; return; }
  sendCmd('MSG:' + text);
  msgStatusEl.textContent = 'sent to car...';
  input.value = '';
  setTimeout(() => { msgStatusEl.textContent = ''; }, 3000);
});

// ---------------- GPS on-demand request ----------------
document.getElementById('gpsReqBtn').addEventListener('click', () => {
  if (!cmdChar) return;
  sendCmd('GPS?');
});

// ---------------- ECO / SPORT ----------------
const ecoBtn = document.getElementById('ecoBtn');
const sportBtn = document.getElementById('sportBtn');
ecoBtn.addEventListener('click', () => {
  sendCmd('MODE:ECO');
  ecoBtn.classList.add('active'); sportBtn.classList.remove('active');
});
sportBtn.addEventListener('click', () => {
  sendCmd('MODE:SPORT');
  sportBtn.classList.add('active'); ecoBtn.classList.remove('active');
});

// ---------------- Differential steering: passive front caster ----------------
 // L:<negative> = LEFT (right motor only); L:<positive> = RIGHT (left motor only).
 // Releasing a steering button sends L:0.
function setupHoldBtn(el, downCmd, upCmd) {
  const start = (e) => { e.preventDefault(); el.classList.add('active'); sendCmd(downCmd); };
  const end   = (e) => { e.preventDefault(); el.classList.remove('active'); sendCmd(upCmd); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}
setupHoldBtn(document.getElementById('leftBtn'), 'L:-70', 'L:0');
setupHoldBtn(document.getElementById('rightBtn'), 'L:70', 'L:0');

// ---------------- Gear select + Hold-to-move + Stop ----------------
let gearMode = 'F';
const fwdGearBtn = document.getElementById('fwdGearBtn');
const revBtn = document.getElementById('revBtn');
fwdGearBtn.addEventListener('click', () => {
  gearMode = 'F';
  fwdGearBtn.classList.add('active'); revBtn.classList.remove('active');
});
revBtn.addEventListener('click', () => {
  gearMode = 'R';
  revBtn.classList.add('active'); fwdGearBtn.classList.remove('active');
});

const holdMoveBtn = document.getElementById('holdMoveBtn');
function holdStart(e) {
  e.preventDefault();
  holdMoveBtn.classList.add('active');
  sendCmd(gearMode === 'F' ? 'F' : 'B');
}
function holdEnd(e) {
  e.preventDefault();
  holdMoveBtn.classList.remove('active');
  sendCmd('S');
}
holdMoveBtn.addEventListener('pointerdown', holdStart);
holdMoveBtn.addEventListener('pointerup', holdEnd);
holdMoveBtn.addEventListener('pointercancel', holdEnd);
holdMoveBtn.addEventListener('pointerleave', holdEnd);

document.getElementById('stopBtn').addEventListener('click', () => {
  holdMoveBtn.classList.remove('active');
  document.getElementById('leftBtn').classList.remove('active');
  document.getElementById('rightBtn').classList.remove('active');
  sendCmd('S'); // firmware clears throttle and steering state
});

if (!navigator.bluetooth) {
  statusEl.textContent = 'Web Bluetooth not supported (use Chrome on Android)';
}
</script>

<!-- ==========================================================================
     PHONE-CAMERA EYE DETECTION - no separate driver unit at all. Uses
     MediaPipe FaceLandmarker (loaded from Google/jsdelivr CDNs) and its
     built-in "eyeBlinkLeft"/"eyeBlinkRight" blendshape scores.

     REQUIRES INTERNET the first time this page loads, to download the
     face-tracking model files - unlike the rest of the page (BLE control),
     which needs no internet at all.
     ========================================================================== -->
<script type="module">
  import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const EYE_CLOSED_THRESHOLD = 0.5;
  let WARN_MS = 2000;   // adjustable via the slider, 1-10s
  let ALERT_MS = 10000; // adjustable via the slider, 1-10s

  let faceLandmarker = null;
  let videoEl, statusEl2, eyeTextEl, drowsyBadge, startBtn, switchBtn;
  let sleepyPopup, sleepySubtitle;
  let camStream = null;
  let camRunning = false;
  let facingMode = 'user';
  let closedStartTs = null;
  let warnedThisEpisode = false;
  let alertedThisEpisode = false;

  // ---------------- two distinct alert sounds ----------------
  // Sound 1: eyes closed too long -> car stopping (a couple of firm beeps)
  // Sound 2: alert stage -> SMS being sent (a faster, more urgent triple-beep)
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, startTime, duration, gainLevel) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainLevel, startTime + 0.01);
    gain.gain.setValueAtTime(gainLevel, startTime + duration - 0.02);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }
  function playWarnSound() {
    ensureAudio();
    const now = audioCtx.currentTime;
    beep(660, now, 0.18, 0.25);
    beep(660, now + 0.24, 0.18, 0.25);
  }
  function playAlertSound() {
    ensureAudio();
    const now = audioCtx.currentTime;
    beep(880, now, 0.12, 0.28);
    beep(880, now + 0.16, 0.12, 0.28);
    beep(880, now + 0.32, 0.12, 0.28);
  }

  // ---------------- adjustable timing sliders ----------------
  const warnSlider = document.getElementById('warnSlider');
  const alertSlider = document.getElementById('alertSlider');
  const warnVal = document.getElementById('warnVal');
  const alertVal = document.getElementById('alertVal');
  warnSlider.addEventListener('input', () => {
    WARN_MS = parseInt(warnSlider.value, 10) * 1000;
    warnVal.textContent = warnSlider.value + 's';
  });
  alertSlider.addEventListener('input', () => {
    ALERT_MS = parseInt(alertSlider.value, 10) * 1000;
    alertVal.textContent = alertSlider.value + 's';
  });

  // ---------------- phone's own location, sent to the car over BLE ----------------
  // Preferred over the car's onboard GPS for the alert SMS - see LOC:
  // command on the main ESP32. Runs continuously once permission is
  // granted, throttled to avoid flooding the BLE link.
  let lastLocSend = 0;
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (pos) => {
        const now = Date.now();
        if (now - lastLocSend < 3000) return; // at most once every 3s
        lastLocSend = now;
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        window.sendCmd('LOC:' + lat + ',' + lon);
      },
      (err) => { console.warn('Geolocation error:', err.message); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  }

  function setStatus(text) { statusEl2.textContent = text; }

  async function ensureModelLoaded() {
    if (faceLandmarker) return;
    setStatus('Loading eye model...');
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const modelOptions = {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
      },
      outputFaceBlendshapes: true,
      runningMode: "VIDEO",
      numFaces: 1
    };
    // GPU is faster on many phones, but some Chrome/device combinations
    // cannot initialize it. Retry on CPU instead of leaving the camera stuck.
    try {
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        ...modelOptions,
        baseOptions: { ...modelOptions.baseOptions, delegate: "GPU" }
      });
    } catch (gpuError) {
      console.warn('GPU model initialization failed; retrying with CPU', gpuError);
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        ...modelOptions,
        baseOptions: { ...modelOptions.baseOptions, delegate: "CPU" }
      });
    }
    setStatus('Model ready - keep your face visible');
  }

  async function startCamera() {
    if (camRunning) return;
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Camera requires HTTPS. Open the GitHub Pages https:// link in Chrome.');
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = 'STARTING...';
    setStatus('Requesting camera permission...');
    try {
      // Request camera only after the user taps START CAMERA. On phones,
      // facingMode=user selects the selfie camera; switch button selects rear.
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
      } catch (firstError) {
        // Fallback for phones/browsers that reject facingMode constraints.
        if (firstError.name === 'OverconstrainedError' || firstError.name === 'NotFoundError') {
          camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } else {
          throw firstError;
        }
      }
      videoEl.srcObject = camStream;
      videoEl.muted = true;
      videoEl.setAttribute('playsinline', '');
      await videoEl.play();
      await ensureModelLoaded();
      camRunning = true;
      closedStartTs = null;
      warnedThisEpisode = false;
      alertedThisEpisode = false;
      startBtn.textContent = 'STOP CAMERA';
      setStatus('Camera active - keep your eyes visible');
      requestAnimationFrame(detectLoop);
    } catch (err) {
      console.error('Camera start failed:', err);
      if (camStream) camStream.getTracks().forEach(track => track.stop());
      camStream = null;
      videoEl.srcObject = null;
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'SecurityError') {
        setStatus('Camera blocked. In Chrome tap the lock/site icon > Permissions > Camera > Allow, then reload.');
      } else if (err.name === 'NotFoundError') {
        setStatus('No camera found. Check that your phone camera works.');
      } else if (err.name === 'NotReadableError') {
        setStatus('Camera is busy. Close other camera apps and retry.');
      } else {
        setStatus('Camera/model failed: ' + (err.message || err.name) + '. Check internet and reload.');
      }
    } finally {
      startBtn.disabled = false;
      if (!camRunning) startBtn.textContent = 'START CAMERA';
    }
  }

  function stopCamera() {
    camRunning = false;
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    if (videoEl) videoEl.srcObject = null;
    startBtn.textContent = 'START CAMERA';
    eyeTextEl.textContent = 'EYES: --';
    closedStartTs = null;
    hideSleepyPopup();
    window.sendCmd('EYE:CLEAR');
  }

  function switchCamera() {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    if (camRunning) { stopCamera(); startCamera(); }
  }

  function showSleepyPopup(text) {
    sleepySubtitle.textContent = text;
    sleepyPopup.classList.add('active');
    drowsyBadge.classList.add('warn');
  }
  function hideSleepyPopup() {
    sleepyPopup.classList.remove('active');
    drowsyBadge.classList.remove('warn');
    drowsyBadge.textContent = 'NORMAL';
  }

  function detectLoop() {
    if (!camRunning) return;
    const now = performance.now();

    let eyeClosed = false;
    try {
      const result = faceLandmarker.detectForVideo(videoEl, now);
      if (result.faceBlendshapes && result.faceBlendshapes.length > 0) {
        const shapes = result.faceBlendshapes[0].categories;
        const left = shapes.find(c => c.categoryName === 'eyeBlinkLeft');
        const right = shapes.find(c => c.categoryName === 'eyeBlinkRight');
        const avgBlink = ((left ? left.score : 0) + (right ? right.score : 0)) / 2;
        eyeClosed = avgBlink > EYE_CLOSED_THRESHOLD;
        setStatus('');
      } else {
        setStatus('No face detected - check camera position');
      }
    } catch (err) {
      setStatus('Detection error: ' + err.message);
    }

    eyeTextEl.textContent = 'EYES: ' + (eyeClosed ? 'CLOSED' : 'OPEN');

    if (eyeClosed) {
      if (closedStartTs === null) {
        closedStartTs = now;
        warnedThisEpisode = false;
        alertedThisEpisode = false;
      }
      const closedDuration = now - closedStartTs;

      if (closedDuration >= ALERT_MS && !alertedThisEpisode) {
        alertedThisEpisode = true;
        window.sendCmd('EYE:ALERT');
        drowsyBadge.textContent = 'ALERT';
        playAlertSound();
        showSleepyPopup('VEHICLE STOPPED \u2014 SMS SENT WITH LOCATION');
      } else if (closedDuration >= WARN_MS && !warnedThisEpisode) {
        warnedThisEpisode = true;
        window.sendCmd('EYE:WARN');
        drowsyBadge.textContent = 'WARNING';
        playWarnSound();
        showSleepyPopup('VEHICLE STOPPED \u2014 STAY ALERT');
      }
    } else if (closedStartTs !== null) {
      closedStartTs = null;
      window.sendCmd('EYE:CLEAR');
      hideSleepyPopup();
    }

    requestAnimationFrame(detectLoop);
  }

  window.addEventListener('DOMContentLoaded', () => {
    videoEl = document.getElementById('eyeCamVideo');
    statusEl2 = document.getElementById('eyeModelStatus');
    eyeTextEl = document.getElementById('eyeStatusText');
    drowsyBadge = document.getElementById('drowsyBadge');
    startBtn = document.getElementById('camStartStopBtn');
    switchBtn = document.getElementById('camSwitchBtn');
    sleepyPopup = document.getElementById('sleepyPopup');
    sleepySubtitle = document.getElementById('sleepySubtitle');

    startBtn.addEventListener('click', () => {
      if (!camRunning) startCamera(); else stopCamera();
    });
    switchBtn.addEventListener('click', switchCamera);
  });
</script>

</body>
</html>
